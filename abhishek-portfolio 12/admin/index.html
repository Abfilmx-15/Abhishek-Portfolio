<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Admin Panel | Abhishek D S</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css">
<script src="../js/site.js"></script>
</head>
<body data-admin>
<div class="orbs" aria-hidden="true"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span></div>
<section id="login" class="login"><form class="lbox" id="lform"><h1>Admin login</h1><p>Sign in to manage your website.</p>
<label class="fl"><span>Username</span><input id="lu" autocomplete="username" required></label>
<label class="fl"><span>Password</span><input id="lp" type="password" autocomplete="current-password" required></label>
<div class="note" id="note" role="alert" hidden></div>
<div class="err" id="lerr" role="alert"></div><button class="btn btn-primary" style="width:100%" type="submit">Log in</button></form></section>
<div id="app" hidden>
<nav class="side" id="side" aria-label="Admin sections"></nav>
<div class="mainc"><div class="bar"><h2 id="ptitle"></h2><div class="r"><span class="state" id="state">All changes saved</span><a class="btn ghost" href="../index.html" target="_blank" rel="noopener">View website</a><button class="btn btn-primary" id="save" type="button">Save changes</button><button class="btn ghost" id="out" type="button">Log out</button></div></div><div id="panel"></div></div>
</div>
<div id="toast" role="status"></div>
<script src="admin.js"></script>
</body>
</html>
